<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login RailGuard</title>
    <link rel="stylesheet" href="sytle.css">
    <link rel="stylesheet" href="../componentes/senha.css?v=20260925-1">
</head>
<body>
    <!-- Integração com o backend desenvolvida com auxílio de IA (OpenAI Codex). -->
    <div class="login">
        <div class="logo"><img src="../Imagens/Logo (1).png" alt="Logo"></div>
        <form id="form-login" class="formulario">
            <div class="titulo"><h2>Login</h2></div>

            <div class="email">
                <input type="email" id="email" name="email" placeholder="Email" maxlength="150" autocomplete="email" required>
            </div>

            <div class="senha">
                <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
            </div>

            <div class="esqueceuSenha">
                <a href="../EsqueceuSenha/esqueceuSenha.html">
                    <button type="button">Esqueceu Sua Senha</button>
                </a>
            </div>

            <div class="termos">
                <input type="checkbox" id="aceito" required>
                <label for="aceito">Aceitar termos de uso</label>
            </div>

            <div class="cadastrar">
                <a href="../cadastro/cadastro.html">
                    <button type="button">Cadastre-se aqui</button>
                </a>
            </div>

            <p id="mensagem-login" role="alert" aria-live="polite"></p>

            <div class="loginBtn">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>

    <script src="../componentes/senha.js?v=20260925-1"></script>
    <script src="script.js"></script>
</body>
</html>
