<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Manutenção dos trilhos | RailGuard</title><link rel="stylesheet" href="trilhos.css?v=20260925-1"></head><body><!-- Tela revisada com auxílio de IA (OpenAI Codex). --><main><section class="painel"><header class="cabecalho-trilhos"><a class="botao-voltar" href="../PaginaInicial/paginaInicialGestor.html" aria-label="Voltar" title="Voltar">&#8592;</a><div><p class="marca">RAILGUARD</p><h1>Manutenção dos trilhos</h1><p>Registre ocorrências e acompanhe o bloqueio das rotas.</p></div></header><form id="form"><input type="hidden" id="id_manutencao_trilho"><label>Rota<select id="id_rota" required><option value="">Selecione uma rota</option></select></label><label>Local do trilho<input id="local_trilho" maxlength="150" placeholder="Ex.: Km 12 — Zona Norte" required></label><label class="largo">Descrição<textarea id="descricao" maxlength="500" placeholder="Descreva o problema ou serviço necessário" required></textarea></label><label>Início<input id="inicio" type="datetime-local" required></label><label>Fim<input id="fim" type="datetime-local"></label><label>Prioridade<select id="prioridade"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option><option value="critica">Crítica</option></select></label><label>Status<select id="status_manutencao"><option value="aberta">Aberta</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></label><label>Responsável<input id="responsavel" maxlength="120" placeholder="Equipe ou funcionário responsável" required></label><div class="botoes largo"><button type="submit">Salvar manutenção</button><button type="button" id="cancelar" hidden>Cancelar edição</button></div></form><p id="mensagem" role="status" aria-live="polite"></p><section class="historico"><div class="titulo-historico"><p class="marca">HISTÓRICO</p><h2>Ocorrências e manutenções</h2></div><div class="tabela"><table><thead><tr><th>Rota/local</th><th>Início</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></section></main><script src="trilhos.js?v=20260925-1"></script><script src="../perfil/perfilAtalho.js"></script></body></html>
