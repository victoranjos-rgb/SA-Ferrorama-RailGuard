<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div class="dashboard">
        <div class="clima">
        <div class="icon-sol">⚙️</div>
        <h1>30°C</h1>
        <p>Min: 24°C</p>
        </div>

        <div class="previsao">
        <div class="dia">
            <p>Amanhã</p>
            <div class="icon-nuvem">🌧️</div>
            <p>Min: 15°C</p>
            <p>Max: 21°C</p>
        </div>
        <div class="dia">
            <p>Quarta</p>
            <div class="icon-nuvem">🌧️</div>
            <p>Min: 17°C</p>
            <p class="maximo">Max: 23°C</p>
        </div>
        <div class="dia">
            <p>Quinta</p>
            <div class="icon-nuvem">🌧️</div>
            <p>Min: 16°C</p>
            <p>Max: 22°C</p>
        </div>
        </div>

        <div class="botoes">
        <button class="card-btn">
            <span class="title">Termos de uso</span>
            <div class="btn-icon">📄</div>
        </button>
        <button class="card-btn">
            <span class="title">Configurações</span>
            <div class="btn-icon">⚙️</div>
        </button>
        </div>

        <div class="chart-card">
        <h2>Produtos mais transportados</h2>
        <canvas id="chart"></canvas>
        </div>
</div>
</body>
</html>
