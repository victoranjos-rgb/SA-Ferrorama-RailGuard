<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastrar cargas | RailGuard</title><link rel="stylesheet" href="cargas.css"></head>
<body><main class="operacao"><a href="../PaginaInicial/paginaInicialGestor.html">← Voltar para página inicial</a><h1>Cadastrar carga</h1><p>Informe o código de uma rota para preencher os dados do trajeto automaticamente.</p><form id="form-carga" class="form-carga"><label>Código da carga ou rota<input id="codigo_carga" placeholder="Ex.: LIN-243" maxlength="20" required></label><label>Descrição da carga<input id="descricao" placeholder="Ex.: Carvão" required></label><label>Trem<select id="id_trem" required><option value="">Selecione o trem</option></select></label><label>Peso em kg<input id="peso_kg" type="number" min="0.01" step="0.01" required></label><label>Origem<input id="origem" required></label><label>Destino<input id="destino" required></label><label>Status<select id="status_carga"><option value="aguardando">Aguardando</option><option value="em_transito">Em trânsito</option><option value="entregue">Entregue</option><option value="atrasada">Atrasada</option></select></label><label>Chegada prevista<input id="chegada_prevista" type="datetime-local"></label><button type="submit">Cadastrar carga</button><p id="mensagem" aria-live="polite"></p></form></main><script src="cadastrarCarga.js"></script><script src="../perfil/perfilAtalho.js"></script></body></html>
