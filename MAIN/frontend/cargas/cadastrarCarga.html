<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cargas</title>
</head>
<body>
    <div class="cadastroCargas">
        <div class="informeId"><h2>Informe o ID do trem</h2></div>
        <div class="id"><input type="text" placeholder="ID"></div>
        <div class="alterarStatus"><h2>Altere o status do trem</h2></div>
        <div class="ativo">
            <input type="checkbox" id="aceito" name="termos" value="sim">
            <label for="aceito">Trem ativo</label>
        </div>
        <div class="origem"><input type="text" placeholder="origem"></div>
        <div class="destino"><input type="text" placeholder="Destino"></div>
        <div class="carga"><input type="text" placeholder="Carga"></div>
        <div class="peso"><input type="number" placeholder="Peso (KG)"></div>
    </div>
</body>
</html>
