<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorar cargas | RailGuard</title>
    <link rel="stylesheet" href="cargas.css">
</head>
<body>
    <main class="operacao">
        <a class="voltar-icone" href="../PaginaInicial/paginaInicialGestor.html" aria-label="Voltar" title="Voltar">&#8592;</a><a class="acao-principal" href="cadastrarCarga.html">Cadastrar nova carga</a>
        <h1>Monitorar cargas</h1><p>Acompanhe as cargas cadastradas e seus status operacionais.</p>
        <input id="busca" placeholder="Prefixo do trem, código, carga, origem ou destino">
        <select id="status"><option value="">Todos os status</option><option value="aguardando">Aguardando</option><option value="em_transito">Em trânsito</option><option value="em_andamento">Em andamento</option><option value="programada">Programada</option><option value="entregue">Entregue</option><option value="atrasada">Atrasada</option><option value="concluida">Concluída</option></select><button id="filtrar">Filtrar</button>
        <p id="mensagem" aria-live="polite"></p><div class="tabela-wrap"><table><thead><tr><th>Prefixo</th><th>Código</th><th>Carga</th><th>Origem → destino</th><th>Status</th><th>Previsão</th></tr></thead><tbody id="lista-cargas"></tbody></table></div>
    </main><script src="cargas.js"></script>
<script src="../perfil/perfilAtalho.js"></script></body>
</html>
