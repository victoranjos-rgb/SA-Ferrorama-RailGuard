<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trens Cadastrados</title>
</head>
<body>
    <div class="trensCadastrados"> 
        <div class="informacoes"><h2>Informe o ID do trem</h2></div>
        <div class="idTrem">
            <input type="text" placeholder="ID">
        </div>
        <div class="informacoesTrem"><h2>Informações do trem</h2></div>
        <p>Modelo do Trem: <span id="modelo"></span></p>
        <p>Tipo do Combustível: <span id="combustivel"></span></p>
        <p>Capacidade da Carga: <span id="capacidade"></span></p>
        <p>Velocidade Máxima: <span id="velocidade"></span></p>
    </div>
</body>
</html>
