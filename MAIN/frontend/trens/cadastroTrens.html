<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de Trens | RailGuard</title><link rel="stylesheet" href="trens.css"></head><body><!-- Tela adaptada com auxílio de IA (OpenAI Codex). --><header><h1 id="titulo-formulario">Cadastrar trem</h1><a href="trensCadastrados.html">Ver trens</a></header><main><form id="form-trem" class="painel"><input type="hidden" id="id_trem"><label>Prefixo<input id="prefixo_trem" maxlength="20" placeholder="Ex.: LOC-1001" required></label><label>Modelo<input id="modelo_trem" maxlength="80" required></label><label>Combustível<select id="tipo_combustivel" required><option value="diesel">Diesel</option><option value="eletrico">Elétrico</option><option value="hibrido">Híbrido</option><option value="outro">Outro</option></select></label><label>Ano de fabricação<input type="number" id="ano_fabricacao" min="1900" max="2100" required></label><label>Capacidade (toneladas)<input type="number" id="capacidade_toneladas" min="0.01" step="0.01" required></label><label>Velocidade máxima (km/h)<input type="number" id="velocidade_maxima_kmh" min="0.01" step="0.01" required></label><label>Situação<select id="situacao_trem" required><option value="ativo">Ativo</option><option value="manutencao">Em manutenção</option><option value="inativo">Inativo</option></select></label><p id="mensagem" role="alert"></p><button type="submit">Salvar trem</button></form></main><script src="trens.js"></script></body></html>
