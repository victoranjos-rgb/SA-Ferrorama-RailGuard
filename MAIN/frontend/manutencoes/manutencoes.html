<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manutenções | RailGuard</title><link rel="stylesheet" href="manutencoes.css"></head><body>
<!-- Tela adaptada do Figma com auxílio de IA (OpenAI Codex). -->
<main class="aplicacao"><section class="painel"><header class="cabecalho"><a class="voltar" href="../PaginaInicial/paginaInicialGestor.html" aria-label="Voltar">&#8592;</a><div><p class="marca">RAILGUARD</p><h1>Manutenção dos trens</h1></div><a class="nova" href="#formulario">Nova manutenção</a></header>
<form id="formulario" class="formulario"><input type="hidden" id="id_manutencao">
<label>Trem<select id="id_trem" required><option value="">Selecione o trem</option></select></label><label>Tipo<select id="tipo_manutencao" required><option value="preventiva">Preventiva</option><option value="corretiva">Corretiva</option><option value="inspecao">Inspeção</option></select></label>
<label class="largo">Descrição<textarea id="descricao" maxlength="500" required placeholder="Descreva o serviço"></textarea></label><label>Início<input id="data_inicio" type="datetime-local" required></label><label>Fim<input id="data_fim" type="datetime-local"></label>
<label>Status<select id="status_manutencao"><option value="agendada">Agendada</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select></label><label>Responsável<input id="responsavel" maxlength="120" required></label><label>Custo (R$)<input id="custo" type="number" min="0" step=".01" value="0" required></label>
<div class="botoes largo"><button type="submit">Salvar manutenção</button><button type="button" id="cancelar" class="secundario" hidden>Cancelar edição</button></div></form><p id="mensagem" role="status" aria-live="polite"></p>
<div class="tabela-container"><table><thead><tr><th>Trem</th><th>Tipo</th><th>Início</th><th>Status</th><th>Responsável</th><th>Ações</th></tr></thead><tbody id="lista-manutencoes"></tbody></table></div></section></main><script src="manutencoes.js"></script></body></html>
