<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorar Rotas</title>
</head>
<body>
    <div class="container">
  <h1>Ocorrência dos trilhos</h1>
  
  <div class="row header">
    <div class="col">Local do trilho</div>
    <div class="col">Tempo que ocorreu</div>
    <div class="col">Status</div>
  </div>

  <div class="row">
    <div class="col"><div class="pill">Joinville Zona sul</div></div>
    <div class="col"><div class="pill">50 minutos</div></div>
    <div class="col"><span class="status finalizado">Finalizado</span></div>
  </div>

  <div class="row">
    <div class="col"><div class="pill">Joinville Zona norte</div></div>
    <div class="col"><div class="pill">4 horas</div></div>
    <div class="col"><span class="status andamento">Em andamento</span></div>
  </div>
</div>
</body>
</html>
