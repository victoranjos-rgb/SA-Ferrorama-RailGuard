<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login RailGuard</title>
    <link rel="stylesheet" href="sytle.css">
</head>
<body>
    <div class="login">
        <div class="logo"><img src="../Imagens/Logo (1).png" alt="Logo"></div>
        <div class="formulario">
        <div class="titulo"><h2>Login</h2></div>

        <div class="email">
            <input type="email" placeholder="Email">
        </div>

        <div class="senha">
            <input type="password" placeholder="Senha">
        </div>

        <div class="esqueceuSenha">
            <button>Esqueceu Sua Senha</button>
        </div>

        <div class="termos">
            <input type="checkbox" id="aceito">
            <label for="aceito">Aceitar termos de uso</label>
        </div>

        <div class="cadastrar">
            <button>Cadastra-se Aqui</button>
        </div>

        <div class="loginBtn">
            <button>Login</button>
        </div>
    </div>
    </div>
</body>
</html>
