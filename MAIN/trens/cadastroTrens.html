<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Trens</title>
</head>
<body>
    <div class="cadastroTrens"> 
        <div class="informacoes"><h2>Informações</h2></div>
        <div class="idTrem">
            <input type="text" placeholder="ID">
        </div>
        <div class="modeloTrem">
            <input type="text" placeholder="Modelo do trem">
        </div>
        <div class="tipoCombustivel">
            <input type="text" placeholder="Tipo de combutível">
        </div>
        <div class="capacidadeCarga">
            <input type="text" placeholder="Capacidade da carga">
        </div>
        <div class="velocidade">
            <input type="text" placeholder="Velocidade Máxima (KM/H)">
        </div>
    </div>
</body>
</html>
